---
name: Release

'on':
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create github release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Package Ansible role
        run: |
          tar -czf "$RUNNER_TEMP/lab-3-${{ github.ref_name }}.tar.gz" \
            --transform='s,^,birchjuice.nginx/,' \
            defaults/ \
            meta/ \
            tasks/ \
            templates/ \
            README.md \
            LICENSE

      - name: Create github release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ runner.temp }}/lab-3-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
