---
- name: Verify
  hosts: all
  become: true

  vars_files:
    - ../../defaults/main.yml

  tasks:
    - name: Check that nginx is installed
      command: nginx -v
      changed_when: false

    - name: Read the deployed webpage
      command: cat {{ nginx_document_root }}/index.html
      changed_when: false
      register: nginx_page

    - name: Verify the default page title
      assert:
        that:
          - "'Hello from Ansible!' in nginx_page.stdout"
          - >-
            'This webpage was deployed using a reusable Ansible role.'
            in nginx_page.stdout
