---
- name: Install nginx
  apt:
    name: "{{ nginx_package_name }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure nginx is enabled and running
  service:
    name: "{{ nginx_service_name }}"
    state: started
    enabled: true

- name: Deploy website
  template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: "0644"
